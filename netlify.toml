# Netlify – frontend (React dashboard). The backend runs on Render; Netlify forwards
# /api, /media and /brand to it, so the browser only ever talks to Netlify (no CORS needed).
#
# >>> Replace ALL occurrences of social-media-agent.onrender.com with your Render URL if it differs. <<<

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://social-media-agent.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://social-media-agent.onrender.com/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/brand/*"
  to = "https://social-media-agent.onrender.com/brand/:splat"
  status = 200
  force = true

# React Router: every other path serves the app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
