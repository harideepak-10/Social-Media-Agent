# Render Blueprint – two services:
#  1. krypsos-agent-app  : the dashboard as a free Static Site – never sleeps, opens instantly and shows our own
#                          "waking up" screen while the agent starts (people never see Render's waking page).
#  2. social-media-agent : the agent (FastAPI + scheduler + Chromium/ffmpeg) as a Docker web service.
# Render dashboard → New → Blueprint → pick this repo. Fill the "sync: false" values when asked.
# >>> If your agent's address differs, replace social-media-agent-y7yv.onrender.com below. <<<
services:
  - type: web
    name: krypsos-agent-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:                   # a new deploy shows up on the next open
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    routes:                    # forward the agent's paths (same address -> no CORS, logins keep working)
      - type: rewrite
        source: /api/*
        destination: https://social-media-agent-y7yv.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://social-media-agent-y7yv.onrender.com/media/*
      - type: rewrite
        source: /brand/*
        destination: https://social-media-agent-y7yv.onrender.com/brand/*
      - type: rewrite
        source: /classic/*
        destination: https://social-media-agent-y7yv.onrender.com/classic/*
      - type: rewrite          # React pages (/items/12, /settings …)
        source: /*
        destination: /index.html

  - type: web
    name: social-media-agent
    runtime: docker
    plan: free                 # free: sleeps after 15 min idle, 512 MB RAM, files reset on restart
    region: singapore          # closest to India
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: ANTHROPIC_DESIGN_MODEL
        value: claude-sonnet-4-5
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SECRET_KEY          # keeps you logged in across restarts
        generateValue: true
      - key: PUBLIC_BASE_URL     # the agent's own address, e.g. https://social-media-agent-y7yv.onrender.com
        sync: false
      - key: FRONTEND_URL        # the dashboard's address (Static Site above), e.g. https://krypsos-agent-app.onrender.com
        sync: false
      - key: LOW_MEMORY          # lighter video encoding for the 512 MB free instance
        value: "1"
      - key: VIDEO_RENDERER      # "pc": videos are queued and made by run_video_worker.bat on your PC
        value: pc
      - key: IMAGE_PROVIDER      # pollinations (free key) | gemini | openai | none – festival photo backgrounds
        value: none
      - key: POLLINATIONS_API_KEY  # free secret key from enter.pollinations.ai
        sync: false
      - key: TTS_PROVIDER
        value: edge
      - key: DATA_DIR            # put a persistent disk here on a paid plan (see README)
        value: /app/data
      # Supabase (free) – keeps the queue, history, settings and media safe across restarts
      - key: DATABASE_URL        # Supabase → Connect → Session pooler URI (port 5432)
        sync: false
      - key: SUPABASE_URL        # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_KEY  # Supabase → Project Settings → API keys → service_role / secret key
        sync: false
      - key: SUPABASE_BUCKET
        value: media
    # Paid plan only – keeps the queue, media and settings across deploys:
    # disk:
    #   name: agent-data
    #   mountPath: /app/data
    #   sizeGB: 5
