# Render Blueprint – backend (FastAPI agent + scheduler + Chromium/ffmpeg) as a Docker web service.
# Render dashboard → New → Blueprint → pick this repo. Fill the "sync: false" values when asked.
services:
  - type: web
    name: social-media-agent
    runtime: docker
    plan: free                 # free: sleeps after 15 min idle, 512 MB RAM, files reset on restart
    region: singapore          # closest to India
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: ANTHROPIC_DESIGN_MODEL
        value: claude-sonnet-4-5
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SECRET_KEY          # keeps you logged in across restarts
        generateValue: true
      - key: PUBLIC_BASE_URL     # e.g. https://social-media-agent.onrender.com (needed later for Instagram)
        sync: false
      - key: LOW_MEMORY          # lighter video encoding for the 512 MB free instance
        value: "1"
      - key: TTS_PROVIDER
        value: edge
      - key: DATA_DIR            # put a persistent disk here on a paid plan (see README)
        value: /app/data
    # Paid plan only – keeps the queue, media and settings across deploys:
    # disk:
    #   name: agent-data
    #   mountPath: /app/data
    #   sizeGB: 5
